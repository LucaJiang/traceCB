name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[ci]'
      - run: pytest -q
      - name: Execute toy-data tutorial
        run: >-
          jupyter nbconvert --execute --to notebook
          docs/tutorial/run_traceCB.ipynb
          --output /tmp/run_traceCB.executed.ipynb
          --ExecutePreprocessor.timeout=600

  docs:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[docs]'
      - run: mkdocs gh-deploy --force
